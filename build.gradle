plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
    splitEnvironmentSourceSets()
	mods {
		"chat-with-npc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	implementation 'org.jetbrains:annotations:24.0.0'
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// https://mvnrepository.com/artifact/org.apache.httpcomponents/httpclient

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// http client dependencies
	implementation "org.apache.httpcomponents:httpclient:4.5.13"
	include "org.apache.httpcomponents:httpclient:4.5.13"
	implementation "org.apache.httpcomponents:httpcore:4.4.14"
	include "org.apache.httpcomponents:httpcore:4.4.14"
	implementation "commons-logging:commons-logging:1.3.5"
	include "commons-logging:commons-logging:1.3.5"

	// Uncomment the following line to enable the deprecated Fabric API modules.
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.
	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

	// testing dependencies
	testImplementation "org.junit.jupiter:junit-jupiter:5.8.2"
	testImplementation "com.google.code.gson:gson:2.8.9"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = group
			artifactId = 'chat-with-npc'
			version = version
			from components.java
			artifact sourcesJar
		}
	}
	repositories {
		maven {
			name = "maven-releases"
			url = uri("https://maven.ussjackdaw.com/repository/maven-releases/")
			credentials {
				username = 'admin'
				password = ''
			}
		}
	}
}
